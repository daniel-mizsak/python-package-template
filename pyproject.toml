# Project Metadata
[project]
  name = "python-package-template-pypi"  # Name has to be unique on pypi.
  version = "0.0.0"  # Version set by GitHub release.
  description = "Python package template configuration."
  readme = "README.md"
  requires-python = ">=3.12"
  license = "MIT"
  license-files = ["LICENSE"]
  authors = [{ name = "Daniel Mizsak", email = "daniel@mizsak.com" }]
  keywords = ["github", "package", "pypi", "python", "template"]
  classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
  ]
  dependencies = ["numpy>=2.4.4"]

  [project.urls]
    Documentation = "https://daniel-mizsak.github.io/python-package-template/"
    Issues = "https://github.com/daniel-mizsak/python-package-template/issues/"
    Repository = "https://github.com/daniel-mizsak/python-package-template/"

[dependency-groups]
  dev = [
    "coverage==7.17.0",
    "nox==2026.10.20",
    "prek==0.5.7",
    "pytest==9.1.1",
    "ruff==0.17.2",
    "ty==0.0.91",
  ]
  docs = ["mkdocstrings-python==2.0.10", "zensical==0.0.72"]

# Build System
[build-system]
  requires = ["uv_build>=0.13,<0.14"]
  build-backend = "uv_build"

# Tools
# Uv
[tool.uv]
  exclude-newer = "1 week"

  [tool.uv.build-backend]
    module-root = "src"
    module-name = "python_package_template"
